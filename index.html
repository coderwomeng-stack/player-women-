
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maraba Dama</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif;text-align:center;padding:18px}
h1{color:#d8b66a;font-size:clamp(27px,6vw,40px)}
p{color:#aaa}
.card{max-width:600px;margin:18px auto;padding:16px;background:#1b1c21;border:1px solid #393a40;border-radius:14px}
button{cursor:pointer;font-size:15px}
.action{padding:12px 18px;border:0;border-radius:8px;background:#d8b66a;color:#151515;font-weight:bold;margin:4px}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:min(94vw,560px);aspect-ratio:1;margin:20px auto;border:4px solid #d8b66a}
.cell{position:relative;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:0;min-width:0;min-height:0}
.light{background:#e8d9b9}
.dark{background:#68503b}
.selected{background:#d8b66a!important}
.hint:after{content:"";width:24%;height:24%;border-radius:50%;background:#75d595;position:absolute}
.piece{width:76%;height:76%;border-radius:50%;border:2px solid #ffffff66;box-shadow:inset 0 -4px 0 #0006,0 2px 5px #0008;pointer-events:none}
.white{background:#f5f0e5}
.black{background:#24252a}
.king:after{content:"♛";display:grid;place-items:center;height:100%;color:#d8b66a;font-size:clamp(15px,4vw,25px)}
#status{font-size:18px;font-weight:bold;color:#d8b66a}
.small{font-size:13px;line-height:1.6}
</style>
</head>
<body>
<h1>♛ MARABA DAMA</h1>
<p>Türk Daması · İki kişilik oyun</p>

<div class="card">
<p id="status">Beyazın sırası</p>
<div id="board"></div>
<button class="action" onclick="newGame()">Yeni Oyun</button>
<p class="small">Beyaz ve siyah sırayla oynar. Taşını seç, sonra gideceği kareye bas.</p>
</div>

<script>
let board=[],turn=1,selected=null,targets=[],forced=null,winner=0;
const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
const el=id=>document.getElementById(id);
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const side=p=>p===1||p===3?1:p===2||p===4?2:0;
const king=p=>p===3||p===4;

function newGame(){
 board=Array.from({length:8},()=>Array(8).fill(0));
 for(let r=0;r<2;r++)for(let c=0;c<8;c++)board[r][c]=2;
 for(let r=6;r<8;r++)for(let c=0;c<8;c++)board[r][c]=1;
 turn=1;selected=null;targets=[];forced=null;winner=0;
 draw();refresh();
}

function captures(r,c){
 let p=board[r][c],s=side(p),out=[];
 if(!p)return out;
 for(const [dr,dc] of dirs){
  let nr=r+dr,nc=c+dc;
  if(king(p)){
   while(inside(nr,nc)&&board[nr][nc]===0){nr+=dr;nc+=dc}
   if(!inside(nr,nc)||!board[nr][nc]||side(board[nr][nc])===s)continue;
   let cr=nr,cc=nc;nr+=dr;nc+=dc;
   while(inside(nr,nc)&&board[nr][nc]===0){
    out.push({r:nr,c:nc,cap:{r:cr,c:cc}});
    nr+=dr;nc+=dc;
   }
  }else if(inside(nr,nc)&&board[nr][nc]&&side(board[nr][nc])!==s){
   let ar=nr+dr,ac=nc+dc;
   if(inside(ar,ac)&&board[ar][ac]===0)out.push({r:ar,c:ac,cap:{r:nr,c:nc}});
  }
 }
 return out;
}

function moves(r,c){
 let p=board[r][c],s=side(p),out=[];
 if(!p)return out;
 for(const [dr,dc] of dirs){
  let nr=r+dr,nc=c+dc;
  if(king(p)){
   while(inside(nr,nc)&&board[nr][nc]===0){
    out.push({r:nr,c:nc});nr+=dr;nc+=dc;
   }
  }else if(inside(nr,nc)&&board[nr][nc]===0&&
   ((s===1&&dr===-1)||(s===2&&dr===1)||(dr===0&&dc!==0))){
   out.push({r:nr,c:nc});
  }
 }
 return out;
}

function allCaptures(s){
 let out=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  if(side(board[r][c])===s)
   captures(r,c).forEach(m=>out.push({...m,from:{r,c}}));
 }
 return out;
}

function allMoves(s){
 let caps=allCaptures(s);
 if(caps.length)return caps;
 let out=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  if(side(board[r][c])===s)
   moves(r,c).forEach(m=>out.push({...m,from:{r,c}}));
 }
 return out;
}

function tap(r,c){
 if(winner)return;
 if(forced&& (r!==forced.r||c!==forced.c))return;
 if(selected){
  const m=targets.find(x=>x.r===r&&x.c===c);
  if(m){play(m);return}
 }
 if(side(board[r][c])===turn){
  let caps=allCaptures(turn);
  if(caps.length&&!caps.some(m=>m.from.r===r&&m.from.c===c)){
   el("status").textContent="Taş alma zorunlu!";
   return;
  }
  selected={r,c};
  targets=caps.length?
   caps.filter(m=>m.from.r===r&&m.from.c===c):
   allMoves(turn).filter(m=>m.from.r===r&&m.from.c===c);
 }else{
  selected=null;targets=[];
 }
 draw();refresh();
}

function play(m){
 let {r,c}=selected,p=board[r][c];
 board[r][c]=0;board[m.r][m.c]=p;
 if(m.cap)board[m.cap.r][m.cap.c]=0;
 if(p===1&&m.r===0)board[m.r][m.c]=3;
 if(p===2&&m.r===7)board[m.r][m.c]=4;
 selected=null;targets=[];
 if(m.cap){
  let more=captures(m.r,m.c);
  if(more.length){
   forced={r:m.r,c:m.c};selected=forced;targets=more;
   draw();el("status").textContent="Taş almaya devam et!";
   return;
  }
 }
 forced=null;
 let next=turn===1?2:1;
 if(allMoves(next).length===0)winner=turn;
 else turn=next;
 draw();refresh();
}

function draw(){
 const root=el("board");root.innerHTML="";
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  let cell=document.createElement("button");
  cell.className="cell "+((r+c)%2?"dark":"light");
  if(selected&&selected.r===r&&selected.c===c)cell.classList.add("selected");
  if(targets.some(m=>m.r===r&&m.c===c))cell.classList.add("hint");
  if(board[r][c]){
   let piece=document.createElement("span");
   piece.className="piece "+(side(board[r][c])===1?"white":"black")+(king(board[r][c])?" king":"");
   cell.appendChild(piece);
  }
  cell.onclick=()=>tap(r,c);
  root.appendChild(cell);
 }
}

function refresh(){
 if(winner)el("status").textContent=(winner===1?"Beyaz":"Siyah")+" kazandı! 🎉";
 else el("status").textContent=turn===1?"Beyazın sırası":"Siyahın sırası";
}

newGame();
</script>
</body>
</html>
